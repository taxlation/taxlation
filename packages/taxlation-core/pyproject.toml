[project]
name = "taxlation-core"
version = "0.1.0"
authors = [
  { name= "Taxlation", email = "info@taxlation.com"}
]
description = "Core for translation of tax regulation into code."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/taxlation/taxlation"
Issues = "https://github.com/taxlation/taxlation/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxlation"]